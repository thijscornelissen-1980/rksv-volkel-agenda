name: Update RKSV Volkel family calendars

on:
  push:
    branches: [main]
    paths:
      - "update_calendar.py"
      - ".github/workflows/update-calendar.yml"
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and prepare calendars
        run: python update_calendar.py --scheduled
        if: github.event_name == 'schedule'
      - name: Download and prepare calendars
        run: python update_calendar.py
        if: github.event_name != 'schedule'
      - name: Commit updated calendars
        run: |
          git add -f jo12.ics jo13.ics volkel.ics
          if git diff --cached --quiet; then
            echo "Calendars are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update JO12 and JO13 calendars"
          git push
